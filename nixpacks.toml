# Railway Nixpacks konfiguratsiyasi
# Tizim darajasidagi kutubxona va dasturlarni o'rnatish

[phases.setup]
# Tesseract OCR va kerakli tizim kutubxonalari
aptPkgs = [
    "tesseract-ocr",
    "tesseract-ocr-uzb",
    "tesseract-ocr-rus",
    "tesseract-ocr-ara",
    "tesseract-ocr-eng",
    "libgl1",
    "libglib2.0-0",
    "libgomp1",
    "libpng-dev",
    "libjpeg-dev",
    "zlib1g-dev",
]

[phases.install]
cmds = [
    "python3 -m venv /opt/venv",
    "/opt/venv/bin/pip install --no-cache-dir -r requirements.txt"
]

[start]
cmd = "/opt/venv/bin/python3 main.py"
